services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    volumes:
      - datos_postgres:/var/lib/postgresql

  kestra:
    image: kestra/kestra:v2.0.7
    user: "root"
    command: server standalone
    env_file: .env
    volumes:
      - datos_kestra:/app/storage
      - ./data:/app/data-fuente
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            basic-auth:
              username: admin@kestra.io
              password: Admin1234
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  dbt:
    image: ghcr.io/dbt-labs/dbt-snowflake:1.9.latest
    env_file: .env
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: /usr/app
      SNOWFLAKE_PRIVATE_KEY_PATH: /keys/rsa_key.p8
    volumes:
      - ./dbt:/usr/app
      - ./keys:/keys:ro
  spark:
    image: spark:3.5.1-python3
    user: root
    env_file: .env
    working_dir: /opt/spark-apps
    environment:
      SNOWFLAKE_PRIVATE_KEY_PATH: /keys/rsa_key.p8
    volumes:
      - ./spark:/opt/spark-apps
      - ./keys:/keys:ro
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - net.snowflake:spark-snowflake_2.12:3.0.0,net.snowflake:snowflake-jdbc:3.16.1
    command: ["build_obt.py"]
    
volumes:
  datos_postgres:
  datos_kestra: